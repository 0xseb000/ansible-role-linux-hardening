---
# Handler for restarting ssh service
- name: Restart ssh
  ansible.builtin.systemd_service:
    name: ssh
    state: restarted
    daemon_reload: true

# Handler for restarting fail2ban
- name: Restart fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: restarted
    daemon_reload: true
  # Skip the task instead of failing on a missing service on a --check run
  when: not ansible_check_mode

# Handler for reloading sysctl
- name: Reload sysctl
  ansible.builtin.command: sysctl --system

# Hanlder for reloading the nftables
- name: Reload nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: reloaded

# Handler for restarting auditd
- name: Restart auditd
  ansible.builtin.systemd_service:
    name: auditd
    state: restarted
  # Skip the task instead of failing on a missing service on a --check run
  when: not ansible_check_mode

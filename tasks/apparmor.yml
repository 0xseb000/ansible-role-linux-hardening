---
# Install and configure Apparmor
- name: Install AppArmor utilities
  ansible.builtin.apt:
    name:
      - apparmor
      - apparmor-utils
    state: present

- name: Ensure AppArmor is enabled and running
  ansible.builtin.systemd_service:
    name: apparmor
    state: started
    enabled: true

# Only when the word "settings" appears in the output, ansible registered it as changed
- name: Set all AppArmor profiles to enforce mode
  ansible.builtin.shell: aa-enforce /etc/apparmor.d/*
  register: hardening_aa_result
  changed_when: "'Setting' in hardening_aa_result.stdout"
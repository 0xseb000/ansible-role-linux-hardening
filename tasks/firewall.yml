---
- name: Load nftables template
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: '0600'
    validate: 'nft -c -f %s'
  notify: Reload nftables

- name: Ensure nftables is enabled and running
  ansible.builtin.systemd_service:
    name: nftables
    state: started
    enabled: true
---
# Disbled unneeded service
- name: Disable unneeded services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: no
  loop:
    - ModemManager
    - iscsid
    - multipathd
    - udisks2
  failed_when: false

# Start systemd to ensure that logs are with the correct time stamp
- name: Ensure systemd-timesync is enabled and runnning
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    state: started
    enabled: yes
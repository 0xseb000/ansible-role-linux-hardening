---
# Create directory for the hardening configuration file (next task)
- name: Create systemd drop-in directory for ssh.service
  ansible.builtin.file:
    path: /etc/systemd/system/ssh.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

# Append content and restart handler
- name: Deploy systemd hardening for ssh.service
  ansible.builtin.copy:
    dest: /etc/systemd/system/ssh.service.d/99-hardening.conf
    mode: '0644'
    content: |
      [Service]
      PrivateTmp=yes
      ProtectSystem=full
  notify: Restart ssh

# sshd configuration template
- name: Deploy sshd hardening configuration
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    owner: root
    group: root
    mode: '0600'
    validate: 'sshd -t -f %s'
  notify: Restart ssh

# Install and configure fail2ban
- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present

- name: Configure fail2ban sshd jail
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    owner: root
    group: root
    mode: '0644'
    content: |
      [sshd]
      enabled = true
      backend = systemd
      maxretry = 5
      bantime = 10m
      findtime = 10m
  notify: Restart fail2ban

- name: Ensure fail2ban is enabled and running
  ansible.builtin.systemd_service:
    name: fail2ban
    state: started
    enabled: true
  # Skip the task instead of failing on a missing service on a --check run
  when: not ansible_check_mode

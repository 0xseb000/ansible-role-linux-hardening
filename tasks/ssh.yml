---
# systemd sandboxing must not be applied to ssh.service, otherwise every Ansible runs over SSH breaks
- name: Remove systemd sandboxing drop-in from ssh.service
  ansible.builtin.file:
    path: /etc/systemd/system/ssh.service.d/99-hardening.conf
    state: absent
  notify: Restart ssh

# cloud-init writes "PasswordAuthentication yes" to 50-cloud-init.conf. sshd
# uses the FIRST value it finds for a keyword and 50- sorts before 99-, so that
# file silently overrides the hardening drop-in below.
- name: Prevent cloud-init from re-enabling ssh password authentication
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-hardening-ssh.cfg
    owner: root
    group: root
    mode: '0644'
    content: |
      ssh_pwauth: false

- name: Remove the cloud-init sshd drop-in
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf
    state: absent
  notify: Restart ssh

# sshd configuration template
- name: Deploy sshd hardening configuration
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    owner: root
    group: root
    mode: '0600'
    validate: 'sshd -t -f %s'
  notify: Restart ssh

# Install and configure fail2ban
- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present

- name: Configure fail2ban sshd jail
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    owner: root
    group: root
    mode: '0644'
    content: |
      [sshd]
      enabled = true
      backend = systemd
      maxretry = 5
      bantime = 10m
      findtime = 10m
  notify: Restart fail2ban

- name: Ensure fail2ban is enabled and running
  ansible.builtin.systemd_service:
    name: fail2ban
    state: started
    enabled: true
  # Skip the task instead of failing on a missing service on a --check run
  when: not ansible_check_mode
